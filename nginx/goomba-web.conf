# Goomba XI website. Installed by `goomba install` to
# /etc/nginx/sites-available/goomba-web.conf. On a home network (no GOOMBA_DOMAIN)
# this is the default site and answers on the server's IP address. With a domain
# and GOOMBA_ACME_EMAIL, certbot then adds the HTTPS server block and the
# HTTP -> HTTPS redirect.

# Slow down password guessing on the sign-in, registration and launcher APIs.
limit_req_zone $binary_remote_addr zone=goomba_auth:10m rate=10r/m;

upstream goomba_web {
    server 127.0.0.1:@WEB_PORT@;
    keepalive 16;
}

server {
    listen 80@LISTEN_OPTS@;
    listen [::]:80@LISTEN_OPTS@;
    server_name @SERVER_NAMES@;

    client_max_body_size 2m;

    # Security headers (the site sets its own Content-Security-Policy).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ ^/api/(auth|launcher/login|register) {
        limit_req zone=goomba_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://goomba_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # Item icons, written by `goomba web-items`.
    location /icons/items/ {
        alias /var/lib/goomba/icons/items/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /_next/static/ {
        proxy_pass http://goomba_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://goomba_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
